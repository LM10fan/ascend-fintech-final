name: ASCEND quality gates

on:
  push:
    branches:
      - feature/ascend-2-full-product
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ascend-ci.yml'

permissions:
  contents: read

jobs:
  validate:
    name: Unit, UI and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Domain and storage tests
        run: npm test
      - name: DOM interaction tests
        run: npm run test:ui
      - name: Production build
        run: npm run build
