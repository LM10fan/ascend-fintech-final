name: Install complete Ascend project
on:
  push:
    paths:
      - '.github/workflows/install-complete-ascend.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Extract complete project
        shell: bash
        run: |
          set -euo pipefail
          unzip -q 'EnCyCloPedic_Fintech (1).zip' -d /tmp/ascend-extract
          test -f /tmp/ascend-extract/EnCyCloPedic_Fintech/src/features/ascend/pages/AssessmentPage.jsx
          test -f /tmp/ascend-extract/EnCyCloPedic_Fintech/src/features/ascend/pages/CreditPage.jsx
          cp -a /tmp/ascend-extract/EnCyCloPedic_Fintech/. .
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Install complete four-page Project Ascend'
            git push
          fi
